name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make demo # generated project must build and vet
      - run: make demo-dir # same project from a directory of .sexp files
      - run: make check-web # every box of the studio's sheet, against the compiler built for the browser
      - run: make demo-secrets # env, file and vault secrets must each build and vet
      - run: make demo-app # the wired program must build, and refuse to start unconfigured

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - run: make demo-postgres # sqlc generate, then the result must build and vet
      - run: make demo-auto # per-store selection: memory and postgres-sqlc in one project
      - run: make demo-outbox # an entity and its events in one transaction

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1
      - run: make demo-api # buf lint and generate, then both servers must build and vet
